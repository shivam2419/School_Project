{% extends "admin/adminbase.html" %}
{% load static %}
{% block title %}| Delete Event{% endblock title %}

{% block body %}
<form action="" method="POST" class="panel confirm">
  {% csrf_token %}
  <div class="warn"><i class="fa-solid fa-triangle-exclamation"></i></div>
  <h1>Are you sure you wanna delete event :-</h1>
  <p class="subject">{{data.event}}</p>
  <div class="actions">
    <input type="submit" value="Delete !!" class="btn btn-solid-danger">
    <a class="btn btn-ghost" href="{% url 'Events' %}">Cancel</a>
  </div>
</form>
{% endblock body %}
