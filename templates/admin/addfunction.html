{% extends "admin/adminbase.html" %}
{% load static %}
{% block title %}| Add Events Images{% endblock title %}

{% block body %}
{% include "admin/_upload_form.html" %}

<div class="page-head"><h1>All Images :</h1></div>
<div class="img-grid data">
  {% for image in images %}
  <div class="img-card card">
    <img src="{{ image.function.url }}" alt="{{ image.description }}" class="responsive-img" id="fetched_img">
    <div class="info center">
      <a class="btn btn-danger btn-sm" href="{% url 'deleteGallery' id image.id %}" onclick="return confirm('Delete this image?')"><i class="fa-regular fa-trash-can"></i>Delete</a>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock body %}
