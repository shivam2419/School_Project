{% extends "admin/adminbase.html" %}
{% load static %}
{% block title %}| Activities{% endblock title %}

{% block body %}
{% include "admin/_upload_form.html" %}

<div class="content-area">
  <div class="page-head"><h1>All Images :</h1></div>
  <div class="img-grid area">
    {% for image in images %}
    <div class="img-card card">
      <img src="{{ image.activity.url }}" alt="{{ image.description }}" class="responsive-img" id="fetched_img">
      <div class="info">
        <p>Upload date : {{image.created_at|date:"Y-m-d"}}</p>
        <a class="btn btn-danger btn-sm" href="{% url 'deleteActivities' image.id %}"><i class="fa-regular fa-trash-can"></i>Delete</a>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock body %}
