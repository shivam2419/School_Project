{% extends "admin/adminbase.html" %}
{% load static %}
{% block title %}| Delete Image{% endblock title %}

{% block body %}
<form action="" method="POST" class="panel confirm">
  {% csrf_token %}
  <img src="{{data.activity.url}}" alt="" class="thumb">
  <h1>Are you sure you want to delete this Image?</h1>
  <div class="actions">
    <input type="submit" value="Delete !!" id="activity-delete-btn" onclick="deleteActivity()" class="btn btn-solid-danger">
    <a class="btn btn-ghost" href="{% url 'Activities' %}">Cancel</a>
  </div>
</form>
<script>
  function deleteActivity() {
    let deleteBtn = document.getElementById('activity-delete-btn');
    deleteBtn.value = "Deleting...";
    deleteBtn.style.opacity = "50%";
  }
</script>
{% endblock body %}
