{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Aryabhatt | Login</title>
    <link rel="icon" href="{% static 'logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.3.0/css/all.css">
    <style>
        :root {
            --navy: #0b3a6f; --navy-dark: #071f3f; --blue: #1560a8; --gold: #f2a900;
            --ink: #1d2a3a; --muted: #5b6b7d; --line: #e2e8f0; --bg: #f1f5fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif; color: var(--ink);
            min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; background: var(--bg);
        }

        .brand-side {
            position: relative; overflow: hidden; color: #fff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 50px;
            background:
                linear-gradient(135deg, rgba(7, 31, 63, 0.96), rgba(21, 96, 168, 0.88)),
                url("{% static 'background-image.png' %}") center / cover;
        }
        .brand-side::before, .brand-side::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); }
        .brand-side::before { width: 320px; height: 320px; background: var(--gold); opacity: 0.28; top: -110px; left: -90px; }
        .brand-side::after { width: 380px; height: 380px; background: #3b8de0; opacity: 0.35; bottom: -150px; right: -100px; }
        .brand-side > * { position: relative; z-index: 1; }
        .logo-ring { padding: 14px; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, 0.4); animation: spin 30s linear infinite; }
        .logo-ring > div { animation: spin 30s linear infinite reverse; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .brand-side img { width: 150px; height: 150px; object-fit: contain; background: #fff; border-radius: 50%; padding: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), 0 0 70px rgba(242, 169, 0, 0.4); display: block; }
        .brand-side h1 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(30px, 4vw, 46px); letter-spacing: 3px; margin-top: 32px; }
        .brand-side h1 span { color: var(--gold); }

        .form-side { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
        .form-wrapper {
            width: 100%; max-width: 430px; background: #fff; border-radius: 22px; padding: 44px 40px;
            box-shadow: 0 24px 60px rgba(11, 58, 111, 0.16); border-top: 5px solid var(--gold);
        }
        .form-wrapper h2 { font-family: 'Playfair Display', Georgia, serif; color: var(--navy); font-size: 32px; margin-bottom: 26px; }

        .form-control { position: relative; margin-bottom: 18px; }
        .form-control > i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--blue); font-size: 15px; z-index: 1; }
        .form-control input {
            width: 100%; height: 54px; padding: 18px 18px 0 48px; border: 1.5px solid var(--line); border-radius: 12px;
            background: var(--bg); font-family: inherit; font-size: 15px; color: var(--ink); outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .form-control input:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgba(21, 96, 168, 0.12); }
        .form-control label {
            position: absolute; left: 48px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #8394a8;
            pointer-events: none; transition: all 0.15s ease;
        }
        .form-control input:is(:focus, :valid) ~ label { top: 14px; font-size: 11px; color: var(--blue); }

        .remember-me { display: flex; align-items: center; gap: 8px; margin: 4px 0 6px; font-size: 13.5px; color: var(--muted); }
        .remember-me input { accent-color: var(--navy); width: 16px; height: 16px; cursor: pointer; }
        .remember-me label { cursor: pointer; }

        form button {
            width: 100%; margin-top: 22px; padding: 15px 0; border: none; border-radius: 50px; cursor: pointer;
            background: linear-gradient(90deg, var(--navy), var(--blue)); color: #fff; font-family: inherit;
            font-size: 15px; font-weight: 600; letter-spacing: 0.5px; box-shadow: 0 10px 24px rgba(11, 58, 111, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        form button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(11, 58, 111, 0.38); }
        #admin-login-btn { color: #fff; }

        @media (max-width: 860px) {
            body { grid-template-columns: 1fr; }
            .brand-side { padding: 36px 20px; }
            .brand-side img { width: 100px; height: 100px; }
            .brand-side h1 { margin-top: 20px; font-size: 28px; }
            .form-wrapper { padding: 32px 24px; }
        }
    </style>
</head>

<body>
    <div class="brand-side">
        <a href="{% url 'index' %}">
            <div class="logo-ring"><div><img src="{% static 'logo2.jpg' %}" alt="logo"></div></div>
        </a>
        <h1>ARYABHATTA</h1>
    </div>

    <div class="form-side">
        <div class="form-wrapper">
            <h2>Sign In</h2>
            <form action="" method="POST" onsubmit="loading()">
                {% csrf_token %}
                <div class="form-control">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" name="name" id="username" required>
                    <label for="username">Username*</label>
                </div>
                <div class="form-control">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" id="pswrd" required>
                    <label for="pswrd">Password*</label>
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="remember-me" onchange="show()">
                    <label for="remember-me">Show password</label>
                </div>
                <button type="submit" id="admin-parent-login-btn"><span id="admin-login-btn">Login</span></button>
            </form>
        </div>
    </div>

    <script>
        function show() {
            let input = document.getElementById('pswrd');
            input.type = input.type === 'text' ? 'password' : 'text';
        }
        function loading() {
            let username = document.getElementById('username').value;
            let pswrd = document.getElementById('pswrd').value;
            if (username && pswrd) {
                let loginBtn = document.getElementById('admin-login-btn');
                loginBtn.innerText = "Logging In...";
                loginBtn.style.opacity = "60%";
            }
        }
    </script>
</body>

</html>
