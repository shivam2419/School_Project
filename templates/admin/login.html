{% load static %}
<!DOCTYPE html>
<!-- Coding By CodingNepal - www.codingnepalweb.com -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aryabhatt | Login</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: #000;
        }

        body::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0.5;
            width: 100%;
            height: 100%;
            background: url("images/hero-img.jpg");
            background-position: center;
        }

        nav {
            text-align: center;
            padding: 25px 60px;
            z-index: 1;
        }

        nav a img {
            width: 100px;
        }

        .form-wrapper {
            position: absolute;
            left: 50%;
            top: 60%;
            border-radius: 4px;
            padding: 70px;
            width: 450px;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, .75);
        }

        .form-wrapper h2 {
            color: #fff;
            font-size: 2rem;
        }

        .form-wrapper form {
            margin: 25px 0 65px;
        }

        form .form-control {
            height: 50px;
            position: relative;
            margin-bottom: 16px;
        }

        .form-control input {
            height: 100%;
            width: 100%;
            background: #333;
            border: none;
            outline: none;
            border-radius: 4px;
            color: #fff;
            font-size: 1rem;
            padding: 0 20px;
        }

        .form-control input:is(:focus, :valid) {
            background: #444;
            padding: 16px 20px 0;
        }

        .form-control label {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
            color: #8c8c8c;
            transition: all 0.1s ease;
        }

        .form-control input:is(:focus, :valid)~label {
            font-size: 0.75rem;
            transform: translateY(-130%);
        }

        form button {
            width: 100%;
            padding: 16px 0;
            font-size: 1rem;
            background: #e50914;
            color: #fff;
            font-weight: 500;
            border-radius: 4px;
            border: none;
            outline: none;
            margin: 25px 0 10px;
            cursor: pointer;
            transition: 0.1s ease;
        }

        form button:hover {
            background: #c40812;
        }

        .form-wrapper a {
            text-decoration: none;
        }

        .form-wrapper a:hover {
            text-decoration: underline;
        }

        .form-wrapper :where(label, p, small, a) {
            color: #b3b3b3;
        }

        form .form-help {
            display: flex;
            justify-content: space-between;
        }

        form .remember-me {
            display: flex;
        }

        form .remember-me input {
            margin-right: 5px;
            accent-color: #b3b3b3;
        }

        form .form-help :where(label, a) {
            font-size: 0.9rem;
        }

        .form-wrapper p a {
            color: #fff;
        }

        .form-wrapper small {
            display: block;
            margin-top: 15px;
            color: #b3b3b3;
        }

        .form-wrapper small a {
            color: #0071eb;
        }
        #admin-login-btn {
            text-decoration: none;
            color: white;
        }
        @media (max-width: 740px) {
            body::before {
                display: none;
            }

            nav,
            .form-wrapper {
                padding: 20px;
            }

            nav a img {
                width: 100px;
            }

            .form-wrapper {
                width: 100%;
                top: 43%;
                margin-top: 10%;
            }

            .form-wrapper form {
                margin: 25px 0 40px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="index"><img src="{% static 'logo2.jpg'%}" alt="logo"></a>
    </nav>
    <div class="form-wrapper">
        <h2>Sign In</h2>
        <form action="" method="POST">
            {% csrf_token %}
            <div class="form-control">
                <input type="text" name="name" id="username" required>
                <label>Username*</label>
            </div>
            <div class="form-control">
                <input type="password" name="password" id="pswrd" required>
                <label>Password*</label>
            </div>
            <div class="form-help">
                <div class="remember-me">
                    <input type="checkbox" id="remember-me" onchange="show()">
                    <label for="remember-me">Show password</label>
                </div>
            </div>
            <button type="submit" id="admin-parent-login-btn"><a onclick='loading()' id="admin-login-btn">Login</a></button>
        </form>
    </div>
    <script>
        function show() {
            let input = document.getElementById('pswrd');
            if (input.type === 'text') {
                input.type = 'password';
            } else {
                input.type = 'text';
            }
        }
        function loading() {
            let username = document.getElementById('username').value;
            let pswrd = document.getElementById('pswrd').value;
            console.log(username, pswrd);
            if(username && pswrd) {
                let loginBtn = document.getElementById('admin-login-btn');
                loginBtn.innerText = "Logging In...";
                loginBtn.style.opacity = "60%";
            }
        }
    </script>
</body>

</html>
